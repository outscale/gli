api:
  AbortMultipartUpload:
    use: AbortMultipartUpload
    entity: multipartupload
    group: MultipartUpload
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name to which the upload was taking place.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] of the object for which the multipart upload was initiated.'
    - name: UploadId
      required: true
      kind: 24
      help: '[REQUIRED] Upload ID that identifies the multipart upload.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: IfMatchInitiatedTime
      kind: 24
      customValue: osctime
      help: If present, this header aborts an in progress multipart upload only if it was initiated on the provided timestamp.
  CompleteMultipartUpload:
    use: CompleteMultipartUpload
    entity: multipartupload
    group: MultipartUpload
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] Name of the bucket to which the multipart upload was initiated.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] Object key for which the multipart upload was initiated.'
    - name: UploadId
      required: true
      kind: 24
      help: '[REQUIRED] ID for the initiated multipart upload.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: IfMatch
      kind: 24
      help: Uploads the object only if the ETag (entity tag) value provided during the WRITE operation matches the ETag of the object in S3.
    - name: IfNoneMatch
      kind: 24
      help: Uploads the object only if the object key name does not already exist in the bucket specified.
    - name: 'MultipartUpload.Parts.#.ChecksumCRC32'
      kind: 24
      help: The base64-encoded, 32-bit CRC-32 checksum of the object.
    - name: 'MultipartUpload.Parts.#.ChecksumCRC32C'
      kind: 24
      help: The base64-encoded, 32-bit CRC-32C checksum of the object.
    - name: 'MultipartUpload.Parts.#.ChecksumSHA1'
      kind: 24
      help: The base64-encoded, 160-bit SHA-1 digest of the object.
    - name: 'MultipartUpload.Parts.#.ChecksumSHA256'
      kind: 24
      help: The base64-encoded, 256-bit SHA-256 digest of the object.
    - name: 'MultipartUpload.Parts.#.ETag'
      kind: 24
      help: Entity tag returned when the part was uploaded.
    - name: 'MultipartUpload.Parts.#.PartNumber'
      kind: 5
      help: Part number that identifies the part.
  CopyObject:
    use: CopyObject
    content: CopyObjectResult
    entity: object
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the destination bucket.'
    - name: CopySource
      required: true
      kind: 24
      help: '[REQUIRED] Specifies the source object for the copy operation.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] The key of the destination object.'
    - name: ACL
      kind: 24
      help: The canned access control list (ACL) to apply to the object.
    - name: BucketKeyEnabled
      kind: 1
      help: Specifies whether Amazon S3 should use an S3 Bucket Key for object encryption with server-side encryption using Key Management Service (KMS) keys (SSE-KMS).
    - name: CacheControl
      kind: 24
      help: Specifies the caching behavior along the request/reply chain.
    - name: ContentDisposition
      kind: 24
      help: Specifies presentational information for the object.
    - name: ContentEncoding
      kind: 24
      help: Specifies what content encodings have been applied to the object and thus what decoding mechanisms must be applied to obtain the media-type referenced by the Content-Type header field.
    - name: ContentLanguage
      kind: 24
      help: The language the content is in.
    - name: ContentType
      kind: 24
      help: A standard MIME type that describes the format of the object data.
    - name: CopySourceIfMatch
      kind: 24
      help: Copies the object if its entity tag (ETag) matches the specified tag.
    - name: CopySourceIfModifiedSince
      kind: 24
      customValue: osctime
      help: Copies the object if it has been modified since the specified time.
    - name: CopySourceIfNoneMatch
      kind: 24
      help: Copies the object if its entity tag (ETag) is different than the specified ETag.
    - name: CopySourceIfUnmodifiedSince
      kind: 24
      customValue: osctime
      help: Copies the object if it hasn't been modified since the specified time.
    - name: CopySourceSSECustomerAlgorithm
      kind: 24
      help: Specifies the algorithm to use when decrypting the source object (for example, AES256 ).
    - name: CopySourceSSECustomerKey
      kind: 24
      help: Specifies the customer-provided encryption key for Amazon S3 to use to decrypt the source object.
    - name: CopySourceSSECustomerKeyMD5
      kind: 24
      help: Specifies the 128-bit MD5 digest of the encryption key according to RFC 1321.
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected destination bucket owner.
    - name: ExpectedSourceBucketOwner
      kind: 24
      help: The account ID of the expected source bucket owner.
    - name: Expires
      kind: 24
      customValue: osctime
      help: The date and time at which the object is no longer cacheable.
    - name: GrantFullControl
      kind: 24
      help: Gives the grantee READ, READ_ACP, and WRITE_ACP permissions on the object.
    - name: GrantRead
      kind: 24
      help: Allows grantee to read the object data and its metadata.
    - name: GrantReadACP
      kind: 24
      help: Allows grantee to read the object ACL.
    - name: GrantWriteACP
      kind: 24
      help: Allows grantee to write the ACL for the applicable object.
    - name: Metadata
      kind: 24
      container: 21
      help: A map of metadata to store with the object in S3.
    - name: MetadataDirective
      kind: 24
      help: Specifies whether the metadata is copied from the source object or replaced with metadata that's provided in the request.
    - name: ObjectLockLegalHoldStatus
      kind: 24
      help: Specifies whether you want to apply a legal hold to the object copy.
    - name: ObjectLockMode
      kind: 24
      help: The Object Lock mode that you want to apply to the object copy.
    - name: ObjectLockRetainUntilDate
      kind: 24
      customValue: osctime
      help: The date and time when you want the Object Lock of the object copy to expire.
    - name: ServerSideEncryption
      kind: 24
      help: The server-side encryption algorithm used when storing this object in Amazon S3.
    - name: Tagging
      kind: 24
      help: The tag-set for the object copy in the destination bucket.
    - name: TaggingDirective
      kind: 24
      help: Specifies whether the object tag-set is copied from the source object or replaced with the tag-set that's provided in the request.
    - name: WebsiteRedirectLocation
      kind: 24
      help: If the destination bucket is configured as a website, redirects requests for this object copy to another object in the same bucket or to an external URL.
  CreateBucket:
    use: CreateBucket
    entity: bucket
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket to create.'
    - name: ACL
      kind: 24
      help: The canned ACL to apply to the bucket.
    - name: GrantFullControl
      kind: 24
      help: Allows grantee the read, write, read ACP, and write ACP permissions on the bucket.
    - name: GrantRead
      kind: 24
      help: Allows grantee to list the objects in the bucket.
    - name: GrantReadACP
      kind: 24
      help: Allows grantee to read the bucket ACL.
    - name: GrantWrite
      kind: 24
      help: Allows grantee to create new objects in the bucket.
    - name: GrantWriteACP
      kind: 24
      help: Allows grantee to write the ACL for the applicable bucket.
    - name: ObjectLockEnabledForBucket
      kind: 1
      help: Specifies whether you want S3 Object Lock to be enabled for the new bucket.
    - name: ObjectOwnership
      kind: 24
      help: The container element for object ownership for a bucket's ownership controls.
  CreateMultipartUpload:
    use: CreateMultipartUpload
    content: AbortDate
    entity: multipartupload
    group: MultipartUpload
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket where the multipart upload is initiated and where the object is uploaded.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] Object key for which the multipart upload is to be initiated.'
    - name: ACL
      kind: 24
      help: The canned ACL to apply to the object.
    - name: BucketKeyEnabled
      kind: 1
      help: Specifies whether Amazon S3 should use an S3 Bucket Key for object encryption with server-side encryption using Key Management Service (KMS) keys (SSE-KMS).
    - name: CacheControl
      kind: 24
      help: Specifies caching behavior along the request/reply chain.
    - name: ContentDisposition
      kind: 24
      help: Specifies presentational information for the object.
    - name: ContentEncoding
      kind: 24
      help: Specifies what content encodings have been applied to the object and thus what decoding mechanisms must be applied to obtain the media-type referenced by the Content-Type header field.
    - name: ContentLanguage
      kind: 24
      help: The language that the content is in.
    - name: ContentType
      kind: 24
      help: A standard MIME type describing the format of the object data.
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: Expires
      kind: 24
      customValue: osctime
      help: The date and time at which the object is no longer cacheable.
    - name: GrantFullControl
      kind: 24
      help: Specify access permissions explicitly to give the grantee READ, READ_ACP, and WRITE_ACP permissions on the object.
    - name: GrantRead
      kind: 24
      help: Specify access permissions explicitly to allow grantee to read the object data and its metadata.
    - name: GrantReadACP
      kind: 24
      help: Specify access permissions explicitly to allows grantee to read the object ACL.
    - name: GrantWriteACP
      kind: 24
      help: Specify access permissions explicitly to allows grantee to allow grantee to write the ACL for the applicable object.
    - name: Metadata
      kind: 24
      container: 21
      help: A map of metadata to store with the object in S3.
    - name: ObjectLockLegalHoldStatus
      kind: 24
      help: Specifies whether you want to apply a legal hold to the uploaded object.
    - name: ObjectLockMode
      kind: 24
      help: Specifies the Object Lock mode that you want to apply to the uploaded object.
    - name: ObjectLockRetainUntilDate
      kind: 24
      customValue: osctime
      help: Specifies the date and time when you want the Object Lock to expire.
    - name: ServerSideEncryption
      kind: 24
      help: The server-side encryption algorithm used when you store this object in Amazon S3 (for example, AES256 , aws:kms ).
    - name: Tagging
      kind: 24
      help: The tag-set for the object.
    - name: WebsiteRedirectLocation
      kind: 24
      help: If the bucket is configured as a website, redirects requests for this object to another object in the same bucket or to an external URL.
  DeleteBucket:
    use: DeleteBucket
    entity: bucket
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] Specifies the bucket being deleted.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  DeleteBucketCors:
    use: DeleteBucketCors
    entity: bucketcor
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] Specifies the bucket whose cors configuration is being deleted.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  DeleteBucketEncryption:
    use: DeleteBucketEncryption
    entity: bucketencryption
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket containing the server-side encryption configuration to delete.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  DeleteBucketLifecycle:
    use: DeleteBucketLifecycle
    entity: bucketlifecycle
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name of the lifecycle to delete.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  DeleteBucketPolicy:
    use: DeleteBucketPolicy
    entity: bucketpolicy
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  DeleteBucketWebsite:
    use: DeleteBucketWebsite
    entity: bucketwebsite
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name for which you want to remove the website configuration.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  DeleteObject:
    use: DeleteObject
    entity: object
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name of the bucket containing the object.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] name of the object to delete.'
    - name: BypassGovernanceRetention
      kind: 1
      help: Indicates whether S3 Object Lock should bypass Governance-mode restrictions to process this operation.
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: IfMatch
      kind: 24
      help: The If-Match header field makes the request method conditional on ETags.
    - name: IfMatchLastModifiedTime
      kind: 24
      customValue: osctime
      help: If present, the object is deleted only if its modification times matches the provided Timestamp .
    - name: IfMatchSize
      kind: 6
      help: If present, the object is deleted only if its size matches the provided size in bytes.
    - name: MFA
      kind: 24
      help: The concatenation of the authentication device's serial number, a space, and the value that is displayed on your authentication device.
    - name: VersionId
      kind: 24
      help: Version ID used to reference a specific version of the object.
  DeleteObjectTagging:
    use: DeleteObjectTagging
    entity: objecttagging
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name containing the objects from which to remove the tags.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] The key that identifies the object in the bucket from which to remove all tags.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: VersionId
      kind: 24
      help: The versionId of the object that the tag-set will be removed from.
  DeleteObjects:
    use: DeleteObjects
    content: Deleted
    entity: object
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name containing the objects to delete.'
    - name: 'Delete.Objects.#.Key'
      required: true
      kind: 24
      help: '[REQUIRED] name of the object.'
    - name: 'Delete.Objects.#.ETag'
      kind: 24
      help: An entity tag (ETag) is an identifier assigned by a web server to a specific version of a resource found at a URL.
    - name: 'Delete.Objects.#.LastModifiedTime'
      kind: 24
      customValue: osctime
      help: If present, the objects are deleted only if its modification times matches the provided Timestamp .
    - name: 'Delete.Objects.#.Size'
      kind: 6
      help: If present, the objects are deleted only if its size matches the provided size in bytes.
    - name: 'Delete.Objects.#.VersionId'
      kind: 24
      help: Version ID for the specific version of the object to delete.
    - name: Delete.Quiet
      kind: 1
      help: Element to enable quiet mode for the request.
    - name: BypassGovernanceRetention
      kind: 1
      help: Specifies whether you want to delete this object even if it has a Governance-type Object Lock in place.
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: MFA
      kind: 24
      help: The concatenation of the authentication device's serial number, a space, and the value that is displayed on your authentication device.
  GetBucketAcl:
    use: GetBucketAcl
    content: .
    entity: acl
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] Specifies the S3 bucket whose ACL is being requested.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetBucketCors:
    use: GetBucketCors
    content: CORSRules
    entity: cors
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name for which to get the cors configuration.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetBucketEncryption:
    use: GetBucketEncryption
    content: ServerSideEncryptionConfiguration
    entity: encryption
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket from which the server-side encryption configuration is retrieved.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetBucketLifecycleConfiguration:
    use: GetBucketLifecycleConfiguration
    content: .
    entity: lifecycle
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket for which to get the lifecycle information.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetBucketLocation:
    use: GetBucketLocation
    content: .
    entity: location
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket for which to get the location.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetBucketPolicy:
    use: GetBucketPolicy
    content: Policy
    entity: policy
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name to get the bucket policy for.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetBucketVersioning:
    use: GetBucketVersioning
    entity: versioning
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket for which to get the versioning information.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetBucketWebsite:
    use: GetBucketWebsite
    content: .
    entity: website
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name for which to get the website configuration.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetObject:
    use: GetObject
    content: .
    entity: objectmetadata
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name containing the object.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] of the object to get.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: IfMatch
      kind: 24
      help: Return the object only if its entity tag (ETag) is the same as the one specified in this header; otherwise, return a 412 Precondition Failed error.
    - name: IfModifiedSince
      kind: 24
      customValue: osctime
      help: Return the object only if it has been modified since the specified time; otherwise, return a 304 Not Modified error.
    - name: IfNoneMatch
      kind: 24
      help: Return the object only if its entity tag (ETag) is different from the one specified in this header; otherwise, return a 304 Not Modified error.
    - name: IfUnmodifiedSince
      kind: 24
      customValue: osctime
      help: Return the object only if it has not been modified since the specified time; otherwise, return a 412 Precondition Failed error.
    - name: PartNumber
      kind: 5
      help: Part number of the object being read.
    - name: Range
      kind: 24
      help: Downloads the specified byte range of an object.
    - name: ResponseCacheControl
      kind: 24
      help: Sets the Cache-Control header of the response.
    - name: ResponseContentDisposition
      kind: 24
      help: Sets the Content-Disposition header of the response.
    - name: ResponseContentEncoding
      kind: 24
      help: Sets the Content-Encoding header of the response.
    - name: ResponseContentLanguage
      kind: 24
      help: Sets the Content-Language header of the response.
    - name: ResponseContentType
      kind: 24
      help: Sets the Content-Type header of the response.
    - name: ResponseExpires
      kind: 24
      customValue: osctime
      help: Sets the Expires header of the response.
    - name: VersionId
      kind: 24
      help: Version ID used to reference a specific version of the object.
  GetObjectAcl:
    use: GetObjectAcl
    content: .
    entity: acl
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name that contains the object for which to get the ACL information.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] The key of the object for which to get the ACL information.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: VersionId
      kind: 24
      help: Version ID used to reference a specific version of the object.
  GetObjectLockConfiguration:
    use: GetObjectLockConfiguration
    content: ObjectLockConfiguration
    entity: lockconfiguration
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket whose Object Lock configuration you want to retrieve.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  GetObjectRetention:
    use: GetObjectRetention
    content: Retention
    entity: retention
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name containing the object whose retention settings you want to retrieve.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] The key name for the object whose retention settings you want to retrieve.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: VersionId
      kind: 24
      help: The version ID for the object whose retention settings you want to retrieve.
  GetObjectTagging:
    use: GetObjectTagging
    content: .
    entity: tagging
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name containing the object for which to get the tagging information.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] Object key for which to get the tagging information.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: VersionId
      kind: 24
      help: The versionId of the object for which to get the tagging information.
  HeadBucket:
    use: HeadBucket
    content: .
    entity: bucket
    group: Bucket
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The bucket name.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
  HeadObject:
    use: HeadObject
    content: .
    entity: objectmetadata
    group: Object
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket that contains the object.'
    - name: Key
      required: true
      kind: 24
      help: '[REQUIRED] The object key.'
    - name: ExpectedBucketOwner
      kind: 24
      help: The account ID of the expected bucket owner.
    - name: IfMatch
      kind: 24
      help: Return the object only if its entity tag (ETag) is the same as the one specified; otherwise, return a 412 (precondition failed) error.
    - name: IfModifiedSince
      kind: 24
      customValue: osctime
      help: Return the object only if it has been modified since the specified time; otherwise, return a 304 (not modified) error.
    - name: IfNoneMatch
      kind: 24
      help: Return the object only if its entity tag (ETag) is different from the one specified; otherwise, return a 304 (not modified) error.
    - name: IfUnmodifiedSince
      kind: 24
      customValue: osctime
      help: Return the object only if it has not been modified since the specified time; otherwise, return a 412 (precondition failed) error.
    - name: PartNumber
      kind: 5
      help: Part number of the object being read.
    - name: Range
      kind: 24
      help: HeadObject returns only the metadata for an object.
    - name: ResponseCacheControl
      kind: 24
      help: Sets the Cache-Control header of the response.
    - name: ResponseContentDisposition
      kind: 24
      help: Sets the Content-Disposition header of the response.
    - name: ResponseContentEncoding
      kind: 24
      help: Sets the Content-Encoding header of the response.
    - name: ResponseContentLanguage
      kind: 24
      help: Sets the Content-Language header of the response.
    - name: ResponseContentType
      kind: 24
      help: Sets the Content-Type header of the response.
    - name: ResponseExpires
      kind: 24
      customValue: osctime
      help: Sets the Expires header of the response.
    - name: VersionId
      kind: 24
      help: Version ID used to reference a specific version of the object.
  ListBuckets:
    use: ListBuckets
    content: Buckets
    entity: bucket
    group: Bucket
    flags:
    - name: MaxBuckets
      kind: 5
      help: Maximum number of buckets to be returned in response.
    - name: Prefix
      kind: 24
      help: Limits the response to bucket names that begin with the specified bucket name prefix.
  ListMultipartUploads:
    use: ListMultipartUploads
    content: CommonPrefixes
    entity: multipartupload
    group: MultipartUpload
    flags:
    - name: Bucket
      required: true
      kind: 24
      help: '[REQUIRED] The name of the bucket to which the multipart upload was initiated.'
    - name: Delimiter
