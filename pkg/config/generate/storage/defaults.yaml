    alias_to: TaggingDirective
  - name: cache-control
    alias_to: CacheControl
  - name: content-disposition
    alias_to: ContentDisposition
  - name: content-encoding
    alias_to: ContentEncoding
  - name: content-language
    alias_to: ContentLanguage
  - name: content-type
    alias_to: ContentType
  - name: server-side-encryption
    alias_to: ServerSideEncryption
  - name: object-lock-mode
    alias_to: ObjectLockMode
  - name: object-lock-retain-until-date
    alias_to: ObjectLockRetainUntilDate
