api:
  ListBuckets:
    content: Buckets
    entity: bucket
    group: Bucket
  HeadBucket:
    content: .
    entity: bucket
    group: Bucket
  ListObjectsV2:
    content: Contents
    entity: object
    group: Object
  ListObjectVersions:
    content: Versions
    entity: objectversion
    group: Object
  GetObject:
    content: .
    entity: objectmetadata
    group: Object
  HeadObject:
    content: .
    entity: objectmetadata
    group: Object
  GetBucketAcl:
    content: .
    entity: acl
    group: Bucket
  GetBucketCors:
    content: CORSRules
    entity: cors
    group: Bucket
  GetBucketEncryption:
    content: ServerSideEncryptionConfiguration
    entity: encryption
    group: Bucket
  GetBucketVersioning:
    entity: versioning
    group: Bucket
  GetBucketLocation:
    content: .
    entity: location
    group: Bucket
  GetBucketPolicy:
    content: Policy
    entity: policy
    group: Bucket
  GetBucketLifecycleConfiguration:
    content: .
    entity: lifecycle
    group: Bucket
  GetBucketWebsite:
    content: .
    entity: website
    group: Bucket
  PutBucketWebsite:
    content: .
    entity: website
    group: Bucket
  GetObjectAcl:
    content: .
    entity: acl
    group: Object
  GetObjectRetention:
    content: Retention
    entity: retention
    group: Object
  GetObjectLockConfiguration:
    content: ObjectLockConfiguration
    entity: lockconfiguration
    group: Object
  GetObjectTagging:
    content: .
    entity: tagging
    group: Object
entities:
  bucket:
    columns:
    - title: Name
      content: .Name
    primary: Bucket
  object:
    columns:
    - title: Key
      content: .Key
    - title: Size
      content: .Size
    - title: LastModified
      content: .LastModified
    primary: Key
aliases:
- entity: bucket
  use: describe bucket
  alias_to: HeadBucket
  aliases:
  - desc
  help: Display a bucket.
  alias_help: HeadBucket --Bucket bucket
  command:
  - api
  - HeadBucket
  - --Bucket
  - '%0'
  - --output
  - yaml
- entity: object
  use: describe key
  alias_to: HeadObject
  aliases:
  - desc
  help: Display an object metadata.
  alias_help: HeadObject --Key key
  command:
  - api
  - HeadObject
  - --Key
  - '%0'
  - --output
  - yaml
  flags:
  - name: bucket
    alias_to: Bucket
    required: true
- entity: object
  use: versions
  alias_to: ListObjectVersions
  aliases:
  - desc
  help: Display an object metadata.
  alias_help: ListObjectVersions
  command:
  - api
  - ListObjectVersions
  - --output
  - yaml
  flags:
  - name: bucket
    alias_to: Bucket
    required: true
- entity: object
  use: download key
  alias_to: GetObject
  aliases:
  - down
  help: Download an object.
  alias_help: GetObject --Key key
  command:
  - api
  - GetObject
  - --Key
  - '%0'
  - --output
  - body
  flags:
  - name: bucket
    alias_to: Bucket
    required: true
  - name: version
    alias_to: VersionId
  - name: part
    alias_to: PartNumber
  - name: range
    alias_to: Range
    help: Range to download, as defined by RFC 9110 (e.g. bytes=0-500)
- entity: object
  use: copy bucket_src/key_src key_dst
  alias_to: CopyObject
  aliases:
  - cp
  help: Copy an object.
  alias_help: CopyObject --CopySource bucket_src/key_src --Key key_dst
  command:
  - api
  - CopyObject
  - --CopySource
  - '%0'
  - --Key
  - '%1'
  - --output
  - success
  flags:
  - name: bucket
    alias_to: Bucket
    required: true
  - name: expires
    alias_to: Expires
  - name: grant-full-control
    alias_to: GrantFullControl
  - name: grant-read
    alias_to: GrantRead
  - name: grant-read-acp
    alias_to: GrantReadACP
  - name: grant-write-acp
    alias_to: GrantWriteACP
  - name: tagging
    alias_to: Tagging
