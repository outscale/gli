    ClusterResponseList.Clusters:
      help: List of clusters retrieved from the API
    ClusterResponseList.ResponseContext:
      help: Information about the context of the response.
    ClusterUpdate.ControlPlanes:
      help: Size of control plane deployment for the cluster
    KubeconfigData.Kubeconfig:
      help: Kubernetes configuration file content for cluster access
    Maintenance.DurationHours:
      help: Duration of the maintenance window in hours
    Maintenance.StartHour:
      help: Hour of the day when maintenance window starts (0-23)
    Maintenance.Tz:
      help: Timezone for the maintenance window
    Maintenance.WeekDay:
